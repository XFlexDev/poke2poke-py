[project]
name = "poke2poke"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.14,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "uvicorn>=0.30,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
